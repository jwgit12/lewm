[project]
name = "lewm"
version = "0.2.0"
description = "LeWorldModel (LeWM): a minimal PyTorch JEPA world model and its training loss"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
